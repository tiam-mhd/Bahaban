services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bahaban
      POSTGRES_USER: bahaban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - bahaban_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bahaban -d bahaban"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bahaban_pgdata:
